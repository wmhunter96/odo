name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build date
        id: date
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short,enable=${{ github.ref_type != 'tag' }}

      # Unraid runs x86_64 only, so a single-platform build keeps CI fast.
      # Add linux/arm64 here later if there's ever a reason to.
      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          # BuildKit's default "auto" progress mode can collapse/truncate a
          # RUN step's own stdout/stderr in the Actions log, down to just
          # the final "did not complete successfully: exit code: 1" summary
          # -- with none of the actual Python traceback that explains why.
          # "plain" streams everything, uncollapsed.
          BUILDKIT_PROGRESS: plain
          # docker/build-push-action's newer "build summary" job-summary
          # feature shows a Dockerfile-source annotation panel around a
          # failing instruction instead of -- and in a way that can bury or
          # replace -- the actual raw, streamed step log with the real
          # stdout/traceback. Disabled so the run log stays the plain
          # scrolling terminal output it always used to be.
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.date.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
